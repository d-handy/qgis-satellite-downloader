name: Bug report
description: Something does not work, or the result looks wrong.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Simple mode (place → purpose → load)
        - Expert mode
        - Locator bar ("sat …")
    validations:
      required: true
  - type: input
    id: dataset
    attributes:
      label: Dataset or recipe
      placeholder: e.g. Current image, or Sentinel-2 L2A (surface reflectance)
  - type: input
    id: place
    attributes:
      label: Place or area
      description: Place name, coordinates, or a description of the rectangle or polygon.
      placeholder: e.g. Atacama, or 50.94, 6.95
  - type: textarea
    id: log
    attributes:
      label: QGIS log
      description: >-
        View → Panels → Log Messages, tab "Satellite Downloader". Paste the lines around
        the problem.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin, QGIS and operating system.
      placeholder: e.g. plugin 0.4.0, QGIS 3.44.2, Windows 11
    validations:
      required: true
