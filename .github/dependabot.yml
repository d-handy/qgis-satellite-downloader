# Keeps the pinned GitHub Actions and the docs dependencies (uv.lock) current.
# The plugin itself has no Python dependencies (it runs on the QGIS Python);
# ruff and gitleaks are pinned in .pre-commit-config.yaml and updated with
# `pre-commit autoupdate`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      docs:
        patterns: ["*"]
