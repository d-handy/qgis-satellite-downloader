# Keeps the pinned GitHub Actions current. The plugin has no Python
# dependencies of its own (it runs on the QGIS Python); ruff and gitleaks are
# pinned in .pre-commit-config.yaml and updated with `pre-commit autoupdate`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
