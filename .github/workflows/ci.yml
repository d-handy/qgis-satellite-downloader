# The checks a pull request must pass: the same commands as in the docs,
# "Testing and code checks".
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before it builds the ZIP.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.29"
      # Same ruff as the pre-commit hook, so CI and a local commit agree.
      - run: uvx ruff@0.16.0 check .
      - run: uvx ruff@0.16.0 format --check .

  test:
    name: tests (QGIS ${{ matrix.qgis }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release (metadata.txt: qgisMinimumVersion) and
        # the one the plugin is developed against.
        qgis: ["3.34.15", "3.44.15"]
    container:
      image: qgis/qgis:${{ matrix.qgis }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline tests
        working-directory: tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python3 -m unittest
          test_core test_catalog test_static_index
          test_offline_io test_download_plan test_gui_usability
          test_package
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: matrix.qgis == '3.44.15'
        with:
          version: "0.11.29"
      # mypy needs the QGIS bindings, so it checks against the image's Python.
      - name: mypy
        if: matrix.qgis == '3.44.15'
        run: uvx mypy@2.4.1 --python-executable "$(command -v python3)"
