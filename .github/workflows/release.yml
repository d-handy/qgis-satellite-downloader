# Publishes a release when a version tag is pushed:
#
#     git tag v0.5.0 && git push origin v0.5.0
#
# The tag must equal "v" + the version in satellite_downloader/metadata.txt.
# The workflow runs the full CI first, then builds the plugin ZIP and attaches
# it to a GitHub release whose notes come from CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Expressions in run: are pasted into the script before the shell sees
    # them; through env the tag name stays data.
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build plugin ZIP
        id: build
        run: echo "zip=$(python tools/package_plugin.py --check-tag "$TAG")" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        # The section between "## [x.y.z]" and the next "## [". The heading is
        # compared as a plain string: as a dynamic regex, gawk reads "\[" as "["
        # and the version becomes a bracket expression.
        run: |
          awk -v h="## [${TAG#v}]" '
            $0 == h {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: >-
          gh release create "$TAG" "$ZIP"
          --title "$TAG" --notes-file notes.md
