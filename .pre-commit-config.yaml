# Checks before each commit. Set up once per clone:
#     pre-commit install
#
# The type checkers need the QGIS Python and are run by hand; see the docs,
# "Testing and code checks".
repos:
  # File hygiene that ruff doesn't cover: Markdown, YAML, TOML. The generated
  # catalogue and indexes are written by tools/ and left as they come out.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^satellite_downloader/data/
      - id: trailing-whitespace
        exclude: ^satellite_downloader/data/
        # Two trailing spaces are a line break in Markdown.
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  # Lint (rules in pyproject.toml) and format. Same version as the local ruff,
  # so the hook and a manual run agree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
      - id: ruff-format

  # Blocks tokens, keys and passwords before they reach the history.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
