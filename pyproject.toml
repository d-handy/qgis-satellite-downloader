# Tool configuration only. The plugin is not a Python package: QGIS loads the
# satellite_downloader folder directly and runs it on its own Python.

[tool.ruff]
# QGIS 3.34+ ships Python 3.10 or newer; the code needs 3.10 (zip(strict=...)).
target-version = "py310"
line-length = 88
extend-exclude = ["tests/_output"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # flake8-bandit
]
ignore = [
    "E501",  # long lines: the formatter wraps code; long strings and URLs stay whole
    "N802",  # Qt/QGIS API names are camelCase (initGui, showEvent, classFactory)
    "N815",  # Qt signals are camelCase class attributes (checkedChanged)
]

[tool.ruff.lint.per-file-ignores]
# Tests start a QGIS application before importing anything that needs it.
"tests/*" = ["E402"]
# The generators put the repo root on sys.path before importing the plugin.
"tools/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["satellite_downloader"]

[tool.mypy]
python_version = "3.10"
files = ["satellite_downloader", "tools"]
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# QGIS, PyQt and GDAL ship without complete type information.
[[tool.mypy.overrides]]
module = ["qgis.*", "osgeo.*", "build_catalog"]
ignore_missing_imports = true

[tool.basedpyright]
include = ["satellite_downloader", "tools"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
# qgis.PyQt re-exports Qt through star imports that pyright cannot follow, and the
# PyQt stubs mark many Qt return values as optional. These rules report those
# artefacts by the hundred, so they are warnings, not errors; mypy is the gate.
reportAttributeAccessIssue = "warning"
reportOptionalMemberAccess = "warning"
reportInvalidTypeForm = "warning"
